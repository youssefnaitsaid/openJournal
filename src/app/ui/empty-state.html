<div
  class="animate-fade-in-up flex flex-col items-center justify-center rounded-[28px] border border-border bg-card p-8 text-center shadow-sm sm:p-12"
>
  <div
    class="bg-gradient-header mb-4 flex size-16 items-center justify-center rounded-[24px] border border-border text-primary"
  >
    <ng-icon [name]="icon()" class="size-8" />
  </div>
  <h3 class="text-lg font-semibold tracking-tight text-foreground">{{ title() }}</h3>
  @if (description() !== '') {
    <p class="mt-2 max-w-sm text-sm text-muted-foreground">{{ description() }}</p>
  }
  @if (actionLabel() !== '') {
    <button
      type="button"
      (click)="action.emit()"
      class="mt-6 inline-flex items-center gap-2 rounded-full bg-primary px-5 py-2 text-sm font-medium text-primary-foreground"
    >
      <ng-icon [name]="actionIcon()" class="size-4" />
      {{ actionLabel() }}
    </button>
  }
</div>
