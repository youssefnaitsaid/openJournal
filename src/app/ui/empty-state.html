<p-card>
  <div class="flex flex-col items-center justify-center p-8 text-center sm:p-12">
    <ng-icon [name]="icon()" class="size-8 text-primary" />
    <h3 class="mt-4 text-lg font-semibold tracking-tight text-foreground">{{ title() }}</h3>
    @if (description() !== '') {
      <p class="mt-2 max-w-sm text-sm text-muted-foreground">{{ description() }}</p>
    }
    @if (actionLabel() !== '') {
      <p-button
        type="button"
        [label]="actionLabel()"
        (onClick)="action.emit()"
        styleClass="mt-6"
      />
    }
  </div>
</p-card>
