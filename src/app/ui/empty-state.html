<p-card>
  <div class="flex flex-col items-center justify-center p-8 text-center sm:p-12">
    <ng-icon [name]="icon()" class="size-8 text-primary" />
    <h3 class="mt-4 text-xl font-semibold tracking-tight">{{ title() }}</h3>
    @if (description() !== '') {
      <p class="mt-2 max-w-sm text-base text-surface-600 dark:text-surface-300">{{ description() }}</p>
    }
    @if (actionLabel() !== '') {
      <p-button
        type="button"
        class="mt-6"
        [label]="actionLabel()"
        (onClick)="action.emit()"
      />
    }
  </div>
</p-card>
