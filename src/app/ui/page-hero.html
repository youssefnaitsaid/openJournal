<div class="relative overflow-hidden rounded-[28px] border border-border bg-card p-6 shadow-sm sm:p-8">
  <div class="bg-gradient-hero pointer-events-none absolute inset-0" aria-hidden="true"></div>
  <div class="relative flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex min-w-0 items-center gap-4">
      @if (icon() !== '') {
        <div
          class="bg-gradient-header flex size-12 shrink-0 items-center justify-center rounded-2xl border border-border text-primary"
        >
          <ng-icon [name]="icon()" class="size-6" />
        </div>
      }
      <div class="min-w-0">
        @if (eyebrow() !== '') {
          <p class="text-xs font-semibold uppercase tracking-[0.24em] text-muted-foreground">{{ eyebrow() }}</p>
        }
        <h1 class="mt-1 text-2xl font-semibold tracking-tight text-foreground sm:text-3xl">{{ title() }}</h1>
        @if (subtitle() !== '') {
          <p class="mt-1 text-sm text-muted-foreground">{{ subtitle() }}</p>
        }
      </div>
    </div>
    <div class="flex shrink-0 flex-wrap items-center gap-2">
      <ng-content />
    </div>
  </div>
</div>
