<div [class]="gridClass()">
  @for (stat of stats(); track stat.label) {
    <p-card>
      <div class="flex items-center gap-2 text-muted-foreground">
        <ng-icon [name]="stat.icon" class="size-3.5" />
        <p class="text-xs font-medium uppercase tracking-[0.18em]">{{ stat.label }}</p>
      </div>
      <p class="mt-1 text-lg font-bold" [class]="stat.valueClass ?? 'text-foreground'">{{ stat.value }}</p>
      @if (stat.info) {
        <p class="text-xs text-muted-foreground">{{ stat.info }}</p>
      }
    </p-card>
  }
</div>
