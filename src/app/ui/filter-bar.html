<div class="flex flex-col gap-1">
  <div class="desk:hidden">
    <button
      type="button"
      class="inline-flex items-center gap-2 rounded-lg px-2 py-1.5 text-base font-medium text-surface-700 hover:bg-surface-100 dark:text-surface-200 dark:hover:bg-surface-800"
      aria-controls="filter-fields"
      [attr.aria-expanded]="expanded()"
      (click)="toggleExpanded()"
    >
      <ng-icon [name]="expanded() ? 'lucideChevronUp' : 'lucideChevronDown'" size="1rem" />
      <span>{{ disclosureLabel() }}</span>
    </button>
  </div>

  <div
    id="filter-fields"
    class="grid-cols-2 items-center gap-2 sm:grid-cols-3 lg:grid-cols-4 desk:grid desk:grid-cols-[13fr_13fr_8fr_12fr_10fr_9fr_12fr_9fr_13fr_auto] desk:gap-1.5"
    [class.grid]="expanded()"
    [class.hidden]="!expanded()"
  >
    <div class="min-w-0">
      <p-floatlabel variant="in">
        <p-datepicker
          ariaLabel="From date"
          size="small"
          [ngModel]="dateFromValue()"
          (onSelect)="onDateChange('dateFrom', $event)"
          (onClear)="onDateChange('dateFrom', null)"
          [showClear]="true"
          dateFormat="yy-mm-dd"
          inputId="dateFrom"
          fluid
        />
        <label for="dateFrom">From</label>
      </p-floatlabel>
    </div>
    <div class="min-w-0">
      <p-floatlabel variant="in">
        <p-datepicker
          ariaLabel="To date"
          size="small"
          [ngModel]="dateToValue()"
          (onSelect)="onDateChange('dateTo', $event)"
          (onClear)="onDateChange('dateTo', null)"
          [showClear]="true"
          dateFormat="yy-mm-dd"
          inputId="dateTo"
          fluid
        />
        <label for="dateTo">To</label>
      </p-floatlabel>
    </div>
    <p-floatlabel variant="in" class="min-w-0">
      <input
        pInputText
        pSize="small"
        aria-label="Asset filter"
        [value]="store.filter().asset"
        (input)="onTextChange('asset', $event)"
        class="w-full"
        id="asset"
      />
      <label for="asset">Asset</label>
    </p-floatlabel>
    <p-floatlabel variant="in" class="min-w-0">
      <p-select
        ariaLabel="Setup filter"
        size="small"
        [options]="setupSelectOptions()"
        [ngModel]="setupValue()"
        (onChange)="onSetupChange($event)"
        inputId="setup"
        fluid
      />
      <label for="setup">Setup</label>
    </p-floatlabel>
    <p-floatlabel variant="in" class="min-w-0">
      <p-select
        ariaLabel="Side filter"
        size="small"
        [options]="sideSelectOptions()"
        [ngModel]="sideValue()"
        (onChange)="onSideChange($event)"
        inputId="side"
        fluid
      />
      <label for="side">Side</label>
    </p-floatlabel>
    <p-floatlabel variant="in" class="min-w-0">
      <p-select
        ariaLabel="Tag filter"
        size="small"
        [options]="tagSelectOptions()"
        [ngModel]="tagValue()"
        (onChange)="onTagChange($event)"
        inputId="tag"
        fluid
      />
      <label for="tag">Tag</label>
    </p-floatlabel>
    <p-floatlabel variant="in" class="min-w-0">
      <p-select
        ariaLabel="Outcome filter"
        size="small"
        [options]="outcomeSelectOptions"
        [ngModel]="store.filter().outcome"
        (onChange)="onOutcomeChange($event)"
        inputId="outcome"
        fluid
      />
      <label for="outcome">Outcome</label>
    </p-floatlabel>
    <p-floatlabel variant="in" class="min-w-0">
      <p-select
        ariaLabel="Grade filter"
        size="small"
        [options]="gradeSelectOptions"
        [ngModel]="gradeValue()"
        (onChange)="onGradeChange($event)"
        inputId="grade"
        fluid
      />
      <label for="grade">Grade</label>
    </p-floatlabel>
    <div class="flex items-center gap-2">
      <p-checkbox inputId="filter-needs-review" [binary]="true" [(ngModel)]="needsReviewModel" />
      <label for="filter-needs-review" class="whitespace-nowrap text-base font-medium text-surface-700 dark:text-surface-200">Needs review</label>
    </div>
    @if (store.isFiltering()) {
      <p-button
        type="button"
        ariaLabel="Reset filter"
        class="shrink-0"
        severity="secondary"
        [outlined]="true"
        (onClick)="reset()"
      >
        <ng-template pTemplate="icon"><ng-icon name="lucideRotateCcw" size="0.875rem" /></ng-template>
      </p-button>
    }
  </div>
</div>
