<div class="flex flex-wrap items-center gap-2">
    <span class="inline-flex items-center gap-1.5 text-sm font-medium">
      <ng-icon name="lucideListFilter" class="size-4" />
      Filter
    </span>
    <label class="inline-flex items-center gap-1.5 text-sm">From
      <p-datepicker
        ariaLabel="From date"
        [ngModel]="dateFromValue()"
        (onSelect)="onDateChange('dateFrom', $event)"
        (onClear)="onDateChange('dateFrom', null)"
        [showClear]="true"
        dateFormat="yy-mm-dd"
        size="small"
      />
    </label>
    <label class="inline-flex items-center gap-1.5 text-sm">To
      <p-datepicker
        ariaLabel="To date"
        [ngModel]="dateToValue()"
        (onSelect)="onDateChange('dateTo', $event)"
        (onClear)="onDateChange('dateTo', null)"
        [showClear]="true"
        dateFormat="yy-mm-dd"
        size="small"
      />
    </label>
    <label class="inline-flex items-center gap-1.5 text-sm">Asset
      <input
        pInputText
        aria-label="Asset filter"
        placeholder="e.g. MES"
        [value]="store.filter().asset"
        (input)="onTextChange('asset', $event)"
        class="w-28"
        size="small"
      />
    </label>
    <label class="inline-flex items-center gap-1.5 text-sm">Setup
      <p-select
        ariaLabel="Setup filter"
        [options]="setupSelectOptions()"
        [ngModel]="store.filter().setup"
        (onChange)="onSetupChange($event)"
        size="small"
      />
    </label>
    <label class="inline-flex items-center gap-1.5 text-sm">Side
      <p-select
        ariaLabel="Side filter"
        [options]="sideSelectOptions()"
        [ngModel]="store.filter().side"
        (onChange)="onSideChange($event)"
        size="small"
      />
    </label>
    <label class="inline-flex items-center gap-1.5 text-sm">Tag
      <p-select
        ariaLabel="Tag filter"
        [options]="tagSelectOptions()"
        [ngModel]="store.filter().tag"
        (onChange)="onTagChange($event)"
        size="small"
      />
    </label>
    <label class="inline-flex items-center gap-1.5 text-sm">Outcome
      <p-select
        ariaLabel="Outcome filter"
        [options]="outcomeSelectOptions"
        [ngModel]="store.filter().outcome"
        (onChange)="onOutcomeChange($event)"
        size="small"
      />
    </label>
    <label class="inline-flex items-center gap-1.5 text-sm">Grade
      <p-select
        ariaLabel="Grade filter"
        [options]="gradeSelectOptions"
        [ngModel]="store.filter().grade"
        (onChange)="onGradeChange($event)"
        size="small"
      />
    </label>
    <p-toggleButton
      ariaLabel="Needs review filter"
      onLabel="Needs review"
      offLabel="Needs review"
      [(ngModel)]="needsReviewModel"
      size="small"
    />
    @if (store.isFiltering()) {
      <p-button
        type="button"
        ariaLabel="Reset filter"
        label="Reset"
        severity="secondary"
        size="small"
        [outlined]="true"
        (onClick)="reset()"
      >
        <ng-template pTemplate="icon"><ng-icon name="lucideRotateCcw" class="size-3.5" /></ng-template>
      </p-button>
    }
    <p-tag [value]="countText() + ' Trades'" severity="secondary" />
</div>
