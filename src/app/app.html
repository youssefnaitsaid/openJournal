<div class="flex min-h-dvh bg-surface-0 text-surface-700 dark:bg-surface-950 dark:text-surface-0">
  <p-drawer
    [(visible)]="sidebarOpen"
    position="left"
    header="openJournal"
    ariaCloseLabel="Close navigation"
  >
    <div class="flex h-full min-h-0 flex-col">
      <nav aria-label="Primary mobile" class="flex min-h-0 flex-1 flex-col gap-1 overflow-y-auto">
        <ng-container [ngTemplateOutlet]="navList" />
      </nav>
      <ng-container [ngTemplateOutlet]="portfolioFooter" [ngTemplateOutletContext]="{ $implicit: true }" />
    </div>
  </p-drawer>

  <aside
    class="hidden w-80 shrink-0 flex-col border-r border-surface-200 p-4 dark:border-surface-700 lg:sticky lg:top-0 lg:flex lg:h-dvh lg:self-start"
  >
    <div class="mb-4 flex shrink-0 items-center gap-3 rounded-xl border border-surface-200 px-3 py-3 dark:border-surface-700">
      <p-avatar label="oJ" shape="circle" />
      <span class="grid flex-1 text-left leading-tight">
        <span class="truncate text-base font-semibold tracking-wide">openJournal</span>
        <span class="truncate text-base text-surface-600 dark:text-surface-300">Trading journal</span>
      </span>
    </div>
    <nav aria-label="Primary" class="flex min-h-0 flex-1 flex-col gap-1 overflow-y-auto">
      <ng-container [ngTemplateOutlet]="navList" />
    </nav>
    <ng-container [ngTemplateOutlet]="portfolioFooter" [ngTemplateOutletContext]="{ $implicit: false }" />
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-30 shrink-0">
      <p-toolbar>
        <ng-template pTemplate="start">
          <p-button
            class="lg:hidden"
            type="button"
            ariaLabel="Toggle navigation"
            [text]="true"
            [rounded]="true"
            severity="secondary"
            (onClick)="toggleSidebar()"
          >
            <ng-template pTemplate="icon"><ng-icon name="lucideMenu" class="size-4" /></ng-template>
          </p-button>
          <span class="truncate text-base font-semibold tracking-tight">openJournal</span>
        </ng-template>
        <ng-template pTemplate="end">
          <p-button
            type="button"
            ariaLabel="Toggle dark mode"
            [text]="true"
            [rounded]="true"
            severity="secondary"
            (onClick)="theme.toggleDarkMode()"
          >
            <ng-template pTemplate="icon">
              <ng-icon [name]="theme.isDark() ? 'lucideSun' : 'lucideMoon'" class="size-4" />
            </ng-template>
          </p-button>
        </ng-template>
      </p-toolbar>
    </header>
    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>

<!-- One source for both the desktop rail and the mobile drawer, so the two
     navigations can never drift in order, labels, or scope controls. -->
<ng-template #navList>
  @for (group of navGroups; track group.label) {
    <p class="px-3 pb-1 pt-4 text-xs font-semibold uppercase tracking-wider text-surface-500 first:pt-0 dark:text-surface-400">{{ group.label }}</p>
    @for (item of group.items; track item.url) {
      <a
        [routerLink]="item.url"
        routerLinkActive="bg-highlight text-highlight"
        ariaCurrentWhenActive="page"
        (click)="closeSidebar()"
        class="flex items-center gap-2 rounded-lg px-3 py-2 text-base hover:bg-surface-100 dark:hover:bg-surface-800"
      >
        <ng-icon [name]="item.icon" class="size-4 shrink-0" />
        <span class="truncate">{{ item.label }}</span>
      </a>
    }
  }
</ng-template>

<ng-template #portfolioFooter let-mobile>
  <footer
    [attr.aria-label]="mobile ? 'Portfolio scope mobile' : 'Portfolio scope'"
    class="mt-4 shrink-0 border-t border-surface-200 pt-4 dark:border-surface-700"
  >
    <p class="px-3 pb-1 text-xs font-semibold uppercase tracking-wider text-surface-500 dark:text-surface-400">Portfolios</p>
    <div class="px-3 py-1">
      <p-select
        ariaLabel="Active portfolio"
        [inputId]="mobile ? 'mobile-active-portfolio' : 'active-portfolio'"
        [options]="portfolioOptions()"
        [ngModel]="store.activeId()"
        (onChange)="onSelectActive($event)"
        fluid
      />
    </div>
    <div class="flex items-center justify-between gap-2 px-3 pt-3">
      <span class="text-sm text-surface-600 dark:text-surface-300">Net P&amp;L</span>
      <p-tag
        [value]="formatSignedDollars(netTotal())"
        [severity]="netTotal() >= 0 ? 'success' : 'danger'"
      />
    </div>
  </footer>
</ng-template>
